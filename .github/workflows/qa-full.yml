# Full QA gate on GitHub's machines, by hand only (user 2026-11-09: keep the full gate off this computer). Actions tab → "QA full (cloud)" → Run workflow,
# or: gh workflow run qa-full.yml -f demos=Demo10,Demo22   ("all" = every demo; costs runner time, don't repeat it for nothing).
# What cannot run here is reported as SKIP-cloud, never as passed (tools/qa/ci_full.py). Results: the job summary and the qa-full-summary artifact.
name: QA full (cloud)
on:
  workflow_dispatch:
    inputs:
      demos:
        description: 'all, or a comma list such as Demo10,Demo22'
        required: true
        default: 'Demo10'
concurrency:
  group: qa-full
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      demos: ${{ steps.l.outputs.demos }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        env:
          DEMOS: ${{ inputs.demos }}
        run: echo "demos=$(python3 tools/qa/ci_full.py --list "$DEMOS")" >> "$GITHUB_OUTPUT"
  full:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        demo: ${{ fromJson(needs.list.outputs.demos) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check_demo reads git history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet pillow numpy
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
      - name: check_demo --full
        env:
          DEMO: ${{ matrix.demo }}
        run: python3 tools/qa/ci_full.py --run "$DEMO" --out out
      - id: n
        env:
          DEMO: ${{ matrix.demo }}
        run: echo "name=$(basename "$DEMO")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-full-${{ steps.n.outputs.name }}
          path: out
  summary:
    needs: full
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: qa-full-*
          path: out
      - run: python3 tools/qa/ci_full.py --summary out >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: qa-full-summary
          path: |
            out/summary.md
            out/summary.json
