# QA on every push (user 2026-11-08 提效标准「推送时自动检查」, DEMO_DESIGN_GUIDE §6 制作流程 v2).
# Informative only: tools/qa/ci_report.py always exits 0, so this never blocks GitHub Pages (a separate, legacy Pages build).
# Results: annotations on the commit + the run's job summary. No browser here (check_demo --quick); the local check_demo is the gate.
name: QA
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check_demo reads git history (?v= freshness, thumbnails vs l10n.js)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet pillow numpy
      - name: check_deps + check_demo --quick on changed demos
        run: python3 tools/qa/ci_report.py "${{ github.event.before || 'HEAD~1' }}"
