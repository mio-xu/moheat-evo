<!doctype html>
<html lang="ja" data-u2>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>ゆきの帰り道 · Snowy Walk Home · MoHeat Evo ASMR</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/game.css?v=cf4af921" />
  <link rel="stylesheet" href="../../shared/story.css?v=1492ec37" />
  <link rel="stylesheet" href="../../shared/pg/pg.css?v=60152172" />
  <link rel="stylesheet" href="../_kit/page.css?v=96f637cb" />
  <link rel="stylesheet" href="../../shared/series.css?v=17452442" />
  <script>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add('embed');</script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="../../../">MoHeat <span>Evo</span> <em>ASMR · Snowy Walk Home</em></a>
    <div class="device">
      <select id="portSelect" aria-label="Serial port"></select>
      <button class="btn sm" id="addPort" type="button">+ Add</button>
      <button class="btn sm primary" id="connectBtn" type="button" disabled>Connect</button>
      <p class="status" id="deviceStatus"><i></i><span>Not connected</span></p>
    </div>
    <button class="estop" id="estop" type="button" title="Esc">■ STOP</button>
  </header>
  <main class="layout">
    <section class="stage-col">
      <div class="stage" id="stage">
        <div id="app" class="pg-stage"><canvas id="ll" aria-hidden="true"></canvas></div>
        <div class="choices" id="choices"></div>
        <div class="subs" id="subs"><p class="line"><span class="ja"><em class="who" id="subWho"></em><span id="subJa"></span></span><span class="en" id="subEn"></span></p></div>
        <p class="vv" id="vv">ひなた ElevenLabs</p>
        <div class="intro" id="intro"><div class="cover-copy"><div class="intro-actions">
          <button class="btn primary big" id="startBtn" type="button">▶ はじめる · Start</button>
          <button class="btn" id="lrBtn" type="button">🎧 Left / Right check</button></div>
          <p class="draft" id="credits">Hinata is an original character · voice ElevenLabs · art: LivLiv character model, OpenAI gpt-image</p></div></div>
      </div>
    </section>
    <aside class="side">
      <div class="card">
        <div class="card-head"><span>Thermal output</span><b id="cmd" class="mono">stop</b></div>
        <div class="meters">
          <div class="meter-row"><span>L cool</span><div class="m cool"><i id="mLc"></i></div><b id="vLc">0</b></div>
          <div class="meter-row"><span>L warm</span><div class="m heat"><i id="mLh"></i></div><b id="vLh">0</b></div>
          <div class="meter-row"><span>R cool</span><div class="m cool"><i id="mRc"></i></div><b id="vRc">0</b></div>
          <div class="meter-row"><span>R warm</span><div class="m heat"><i id="mRh"></i></div><b id="vRh">0</b></div>
        </div>
      </div>
      <div class="card"><div class="card-head"><span>Progress</span><b id="clock" class="mono">0:00</b></div><ol class="steps" id="steps"></ol></div>
      <div class="card">
        <label class="row"><span>Intensity</span><input id="intensity" type="range" min="0" max="100" value="100" /><b id="intensityVal">100%</b></label>
        <label class="row check"><input id="sendOn" type="checkbox" checked /> <span>Send to device</span></label>
      </div>
    </aside>
  </main>
  <script src="../../../device.js?v=1b7cb0e6"></script>
  <script src="../../shared/shell.js?v=f54b050f"></script>
  <script>window.PG_LIVLIV = "../../shared/livliv/index.js?v=050";</script>
  <script src="../../shared/pg/rules.js?v=24396c61"></script>
  <script src="../../shared/pg/pg.js?v=430f1ef3"></script>
  <script src="../../shared/pg/pg.audio.js?v=28286c06"></script>
  <script src="../../shared/pg/pg.fx.js?v=d27b5989"></script>
  <script src="../../shared/pg/pg.thermal.js?v=ae93d9ea"></script>
  <script src="../../shared/pg/pg.stage.js?v=0ec40aed"></script>
  <script src="../../shared/pg/pg.ll.js?v=2f3ee4ca"></script>
  <script src="../../shared/pg/pg.ui.js?v=019f0270"></script>
  <script src="../../shared/pg/pg.story.js?v=9a4ee4a2"></script>
  <script src="../_kit/characters/hinata/pack.js?v=d6f29c2b"></script>
  <script src="media/story.js?v=a8ebf405"></script>
  <script src="media/voice.js?v=47083f04"></script>
  <script src="../_kit/page.js?v=1dd202e5" data-char="../_kit/characters/hinata/"></script>
  <script src="../../shared/voice.js?v=193765ef"></script>
  <script src="../../shared/nav.js?v=c62d9e64"></script>
</body>
</html>
