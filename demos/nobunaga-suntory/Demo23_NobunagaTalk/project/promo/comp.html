<!doctype html>
<!-- Promo compositor v3: one 1920 × 1080 frame per window.render(desc) (edit.py → frames.json). Deliberately plain, like the user's
     own film: one typeface family, white text on flat dark boxes, left aligned, no glow / blur / gradients / shadows / icons. The only
     output graphic is the demo's own radar, cropped from the same captured frame as the picture. -->
<html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0c0e12}
body{font-family:Inter,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#root,.foot{position:absolute;inset:0;overflow:hidden}
.foot img{position:absolute;left:0;top:0;transform-origin:0 0}
.box{position:absolute;background:rgba(0,0,0,.72);padding:14px 24px 16px}
.ja{font-weight:700;line-height:1.3}.en{font-weight:500;line-height:1.3;margin-top:4px}
.name{color:#b8bec6;font-weight:500;margin-right:.6em}
.radar{position:absolute;overflow:hidden;border-radius:18px;background:#15100b}
.radar img{position:absolute;left:0;top:0;transform-origin:0 0;filter:brightness(1.8) contrast(1.12)}
.big{position:absolute;left:100px}
</style></head><body><div id="root"></div>
<script>
const cache = {};
async function img(src) { let i = cache[src]; if (!i) { i = new Image(); i.src = src; cache[src] = i; } if (!i.complete || !i.naturalWidth) await i.decode().catch(() => {}); return i; }
function drop() { const k = Object.keys(cache); for (const x of k.slice(0, Math.max(0, k.length - 30))) delete cache[x]; }
function wave(levels) { const c = document.createElement('canvas'); c.width = 360; c.height = 72; c.style.cssText = 'width:180px;height:36px;display:block;margin-top:8px'; const g = c.getContext('2d'); g.fillStyle = '#fff'; levels.forEach((v, i) => { const h = 6 + 62 * Math.min(1, v); g.fillRect(i * 15 + 2, 36 - h / 2, 8, h); }); return c; }
window.render = async (D) => {
  const root = document.getElementById('root'); let h = '';
  if (D.foot) { const f = D.foot, im = await img(f.src), [x, y, w] = f.crop || [0, 0, im.naturalWidth], s = 1920 / w;
    h += `<div class="foot" style="opacity:${f.a ?? 1}"><img src="${f.src}" style="width:${im.naturalWidth}px;height:${im.naturalHeight}px;transform:scale(${s}) translate(${-x}px,${-y}px)"></div>`; }
  if (D.radar) { const r = D.radar, im = await img(r.src), [x, y, w] = r.crop, s = r.size / w;
    h += `<div class="radar" style="left:${r.x}px;top:${r.y}px;width:${r.size}px;height:${r.size}px;opacity:${r.a}"><img src="${r.src}" style="width:${im.naturalWidth}px;height:${im.naturalHeight}px;transform:scale(${s}) translate(${-x}px,${-y}px)"></div>`; }
  if (D.line) { const l = D.line; h += `<div class="box" style="left:${l.x}px;${l.y != null ? `top:${l.y}px` : `bottom:${l.b}px`};${l.w ? `width:${l.w}px;` : ''}opacity:${l.a}"><div class="ja" style="font-size:${l.js || 36}px">${l.ja}</div><div class="en" style="font-size:${l.es || 24}px">${l.en}</div></div>`; }
  if (D.sub) h += `<div class="box" style="left:100px;bottom:64px;max-width:1500px"><div class="ja" style="font-size:46px"><span class="name">${D.sub.name}</span>${D.sub.ja}</div><div class="en" style="font-size:30px">${D.sub.en}</div></div>`;
  if (D.you) h += `<div class="box" style="left:100px;bottom:64px;max-width:1500px;opacity:${D.you.a}"><div class="ja" style="font-size:46px"><span class="name">あなた</span>${D.you.ja}</div><div class="en" style="font-size:30px">${D.you.en}</div><div id="wv"></div></div>`;
  if (D.band) { const b = D.band, js = Math.min(40, Math.floor(1180 / Math.max(b.ja.length + b.name.length + 1, 1))); h += `<div style="position:absolute;left:98px;top:976px;width:1330px"><div class="ja" style="font-size:${js}px;line-height:1.2"><span class="name">${b.name}</span>${b.ja}</div><div class="en" style="font-size:27px;line-height:1.2">${b.en}</div></div>`; }
  if (D.endline) h += `<div class="big" style="top:430px;opacity:${D.endline.a}"><div style="font-size:78px;font-weight:800;line-height:1.15">${D.endline.ja}</div><div style="font-size:36px;font-weight:500;margin-top:18px">Real-time AI conversation</div><div style="font-size:30px;font-weight:500;margin-top:10px">moheat-evo.github.io</div></div>`;
  if (D.title) h += `<div class="big" style="top:420px;opacity:${D.title.a}"><div style="font-size:78px;font-weight:800;line-height:1.15">${D.title.ja}</div><div style="font-size:34px;font-weight:500;margin-top:16px">${D.title.en}</div></div>`;
  if (D.end) { const e = D.end, im = await img(e.src); h += `<img src="${e.src}" style="position:absolute;left:1040px;top:140px;width:780px;height:800px;object-fit:cover;border-radius:18px">
    <div class="big" style="top:440px"><div style="font-size:84px;font-weight:800;letter-spacing:-.02em">MoHeat Evo</div><div style="font-size:36px;font-weight:500;margin-top:18px">moheat-evo.github.io</div></div>
    <div style="position:absolute;left:100px;bottom:40px;font-size:18px;font-weight:500;color:#8a919b">Music: “EDM Detection Mode” by Kevin MacLeod (incompetech.com), licensed under Creative Commons: By Attribution 4.0</div>`; }
  if (D.fade) h += `<div style="position:absolute;inset:0;background:#0c0e12;opacity:${D.fade}"></div>`;
  root.innerHTML = h;
  if (D.you && D.you.wave) document.getElementById('wv').append(wave(D.you.wave));
  await Promise.all([...root.querySelectorAll('img')].map((i) => (i.complete ? null : i.decode().catch(() => {}))));
  drop(); await document.fonts.ready; return true;
};
</script></body></html>
