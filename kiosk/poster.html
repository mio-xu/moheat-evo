<!doctype html>
<html lang="en" data-kiosk-app>
<head>
  <meta charset="utf-8" />
  <title>MoHeat Evo · Queue QR poster (A4)</title>
  <meta name="robots" content="noindex" />
  <style>
    /* print-ready A4 poster for the queue line (opened from the kiosk staff panel: the QR carries this kiosk's offered demos) */
    @page { size: A4 portrait; margin: 12mm; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, "Noto Sans JP", "PingFang SC", "Hiragino Sans", system-ui, sans-serif; color: #17121f; background: #fff; }
    .page::before { content: ""; display: block; width: 100%; height: 6mm; border-radius: 3mm; background: linear-gradient(90deg, #ff8a3d, #ffd479 50%, #9fd8ff); -webkit-print-color-adjust: exact; print-color-adjust: exact; }   /* style B: warm | cool */
    .page { width: 186mm; min-height: 270mm; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5mm; padding-top: 4mm; }
    .logo { font: 800 18mm/1 Inter, sans-serif; background: linear-gradient(90deg, #2a8de0, #f0652a); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .logo span { font-weight: 300; }
    h1 { margin: 0; font-size: 11mm; line-height: 1.2; } h2 { margin: 0; font-size: 7.5mm; font-weight: 700; color: #4a3f58; line-height: 1.3; }
    .qr { width: 110mm; } .qr svg { width: 100%; height: auto; display: block; }
    ol { list-style: none; padding: 0; margin: 2mm 0 0; columns: 2; column-gap: 8mm; text-align: left; font-size: 3.6mm; line-height: 1.5; width: 100%; }
    ol li b { display: inline-block; min-width: 7mm; }
    .foot { margin-top: auto; font-size: 3.2mm; color: #6b6078; }
    .noprint { position: fixed; right: 12px; top: 12px; } @media print { .noprint { display: none; } }
    .noprint button { font: 600 15px/1 sans-serif; padding: 10px 16px; border-radius: 999px; border: 0; background: #17121f; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="noprint"><button onclick="print()">Print / Save as PDF</button></div>
  <div class="page">
    <div class="logo">MoHeat <span>Evo</span></div>
    <h1>Scan to choose your demo while you wait</h1>
    <h2>待っている間にスキャンして、物語を選ぼう<br />排队时扫码，先选好想体验的故事</h2>
    <div class="qr" id="qr"></div>
    <h2>Then tap the same number at the machine · 順番が来たら同じ番号をタップ · 轮到你时点同样的号码</h2>
    <ol id="list"></ol>
    <p class="foot">Nothing is stored or sent · 何も保存・送信しません · 不保存、不发送任何信息 — <span id="url"></span></p>
  </div>
  <script>window.MOHEAT_NAV_DATA_ONLY = true;</script>
  <script src="../demos/shared/nav.js?v=170c7055"></script>
  <script src="../demos/shared/kiosk.js?v=3c5b6106"></script>
  <script src="qrcode.min.js"></script>
  <script>
    (() => { const K = window.MoHeatKiosk, D = window.MoHeatDemos.DEMOS, u = K.pickUrl(D);
      const q = qrcode(0, 'M'); q.addData(u); q.make(); document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
      document.getElementById('url').textContent = u.replace(/\?.*/, '');
      document.getElementById('list').innerHTML = K.offered(D).map((d, i) => `<li><b>${i + 1}</b>${d.en} · ${d.ja}</li>`).join(''); })();
  </script>
</body>
</html>
