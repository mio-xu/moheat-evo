<!doctype html>
<html lang="en" data-kiosk-app>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoHeat Evo · Queue screen</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { color-scheme: dark; --warm: #ff8a4a; --cool: #6cc4ff; --gold: #ffd58a; --ff: Inter, "Noto Sans JP", "PingFang SC", "Hiragino Sans", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07060c; color: #f6f0fa; font-family: var(--ff); cursor: none; }
    .wrap { position: fixed; inset: 0; display: grid; grid-template-columns: 64fr 36fr; grid-template-rows: auto 1fr; gap: 2vh 2vw; padding: 3vh 2.4vw; }
    header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 2vw; }
    .logo { font: 800 5.4vh/1 var(--ff); background: linear-gradient(90deg, var(--cool), var(--warm)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .logo span { font-weight: 300; }
    header p { margin: 0; font: 600 2.8vh/1.2 var(--ff); color: #cfc3dc; }
    .left { display: flex; flex-direction: column; gap: 1.6vh; min-height: 0; }
    .now { font: 700 3.4vh/1.2 var(--ff); min-height: 4vh; } .now .no { display: inline-grid; place-items: center; min-width: 1.8em; height: 1.8em; padding: 0 .4em; margin-right: .5em; border-radius: 999px; background: var(--gold); color: #2a1606; }
    .mirror { position: relative; flex: 1; min-height: 0; border-radius: 2vh; overflow: hidden; background: #000; }
    .mirror img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s; }
    .mirror img.on { opacity: 1; } .mirror img.kb.on { animation: kb 9s linear forwards; }
    @keyframes kb { from { transform: scale(1.03); } to { transform: scale(1.12) translateX(-1.5%); } }
    .mirror .sub { position: absolute; left: 4%; right: 4%; bottom: 4%; text-align: center; font: 700 3.2vh/1.35 var(--ff); text-shadow: 0 2px 8px #000, 0 0 2px #000; }
    .mirror .tag { position: absolute; left: 2%; top: 3%; padding: .4em .9em; border-radius: 999px; background: rgba(0,0,0,.55); font: 700 2vh/1 var(--ff); color: #ffd58a; }
    .right { display: flex; flex-direction: column; gap: 2vh; min-height: 0; }
    .ears { position: relative; flex: 1.2; min-height: 0; border-radius: 2vh; background: radial-gradient(ellipse at 50% 60%, #1b1528, #0c0a12 70%); }
    .ears canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ears .lab { position: absolute; left: 0; right: 0; bottom: 2.5%; text-align: center; font: 600 2.2vh/1.2 var(--ff); color: #cfc3dc; }
    .qrbox { display: flex; gap: 1.6vw; align-items: center; background: rgba(255,255,255,.04); border-radius: 2vh; padding: 1.6vh; }
    .qr { width: 22vh; flex: none; background: #fff; border-radius: 1.4vh; padding: 1vh; } .qr svg { display: block; width: 100%; height: auto; }
    .qrbox p { margin: 0; font: 800 3.2vh/1.25 var(--ff); } .qrbox small { display: block; margin-top: .8vh; font: 500 2vh/1.3 var(--ff); color: #cfc3dc; }
    .top h3 { margin: 0 0 1vh; font: 700 2vh/1 var(--ff); color: var(--gold); letter-spacing: .1em; text-transform: uppercase; }
    .top ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1vh; } .top li { display: flex; align-items: center; gap: 1vw; font: 700 2.6vh/1.2 var(--ff); }
    .top li .no { flex: none; display: grid; place-items: center; width: 2em; height: 2em; border-radius: 999px; background: var(--gold); color: #2a1606; }
    .top li small { display: block; font: 500 1.9vh/1.3 var(--ff); color: #ffc9a6; }
    /* promo video mode: the video fills the screen, the QR badge (style B frame) always on top in a corner */
    .promo { position: fixed; inset: 0; z-index: 20; background: #000; } .promo[hidden] { display: none; }
    .promo video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .qbadge { position: absolute; display: flex; align-items: center; gap: 1.4vh; padding: 1.4vh; border-radius: 2.2vh; background: rgba(12, 10, 20, .72); backdrop-filter: blur(10px);
      border: 2px solid transparent; background-clip: padding-box; box-shadow: 0 0 0 2px rgba(255, 180, 120, .7), 0 0 30px rgba(255, 140, 60, .35), 0 0 30px rgba(110, 190, 255, .25); }
    .qbadge .qr { width: var(--qs, 24vh); background: #fff; border-radius: 1.2vh; padding: .8vh; } .qbadge .qr svg { display: block; width: 100%; height: auto; }
    .qbadge p { margin: 0; max-width: calc(var(--qs, 24vh) * 1.15); font: 800 calc(var(--qs, 24vh) * .13)/1.25 var(--ff); color: #fff; }
    .qbadge[data-c="br"] { right: 2.4vw; bottom: 3vh; } .qbadge[data-c="bl"] { left: 2.4vw; bottom: 3vh; } .qbadge[data-c="tr"] { right: 2.4vw; top: 3vh; } .qbadge[data-c="tl"] { left: 2.4vw; top: 3vh; }
    .ptag { position: absolute; left: 2.4vw; top: 3vh; padding: .7vh 1.4vw; border-radius: 999px; background: rgba(12, 10, 20, .7); font: 700 2.6vh/1.2 var(--ff); color: #ffd479; }
    .ptag[hidden] { display: none; }
    /* signs (kiosk/signs.js, REQUIREMENTS §12): touch OK / do not touch + photos, EN + 日本語 for the people in line, readable from 2–3 m.
       Titles only (the "staff will be back soon" line too when unattended); the two-ear view keeps at least 24 vh */
    .ears { min-height: 18vh; }
    .q-signs { display: flex; gap: 1.6vw; align-items: center; padding: 1.2vh 1.2vw; border-radius: 2vh; background: rgba(255,255,255,.06); font: 800 2.1vh/1.15 var(--ff); --ms-ic: 6.5vh; }
    .q-signs .ms-sign { flex: 0 1 auto; } .q-signs .ms-sign:first-child { flex: 1 1 auto; } .q-signs .ms-tx p + p b { font-size: .86em; }
    .q-signs .ms-tx small, .p-signs .ms-tx small { display: none; }
    .q-signs[data-state="off"] { background: rgba(215, 38, 61, .18); box-shadow: inset 0 0 0 3px rgba(255, 110, 130, .7); }
    .q-signs[data-state="off"] [data-k="notouch"] .ms-tx small, .p-signs[data-state="off"] [data-k="notouch"] .ms-tx small { display: block; color: #ffd479; opacity: 1; }
    .qbadge { display: grid; grid-template-columns: auto auto; }
    .p-signs { grid-column: 1 / -1; display: flex; gap: calc(var(--qs, 24vh) * .1); align-items: center; padding-top: 1vh; border-top: 1px solid rgba(255,255,255,.18);
      font: 800 calc(var(--qs, 24vh) * .066)/1.15 var(--ff); color: #fff; --ms-ic: calc(var(--qs, 24vh) * .22); max-width: calc(var(--qs, 24vh) * 2.3); }
    .p-signs .ms-sign:first-child { flex: 1 1 auto; } .q-signs [data-k=photo] b, .p-signs [data-k=photo] b { white-space: nowrap; } .q-signs [data-k=photo], .p-signs [data-k=photo] { flex-shrink: 0; } .p-signs .ms-tx p + p b { font-size: .86em; }
    .hint { position: fixed; right: 1vw; bottom: .6vh; font-size: 11px; color: #3c3448; }
    /* MoHeat Evo connection — the same state as the visitor screen / staff panel / demos (device.js MoHeatDevice.state, sent over the
       BroadcastChannel by kiosk/app.js): a status pill in the header, the big "disconnected" alert on 'lost' (REQUIREMENTS §7) */
    .qdev { margin-left: auto; align-self: center; display: inline-flex; align-items: center; gap: .6em; padding: .5em 1em; border-radius: 999px; background: rgba(255,255,255,.06); font: 700 2vh/1 var(--ff); color: #cfc3dc; }
    .qdev i { width: 1.1em; height: 1.1em; border-radius: 50%; background: #5a4f66; } .qdev[data-state="connected"] i { background: #5fd38a; box-shadow: 0 0 .6em #5fd38a; }
    .qdev[data-state="connecting"] i, .qdev[data-state="reconnecting"] i { background: #e0b04a; } .qdev[data-state="lost"] i, .qdev[data-state="error"] i { background: #ff6b81; box-shadow: 0 0 .6em #ff6b81; }
    .qdev[data-state="lost"], .qdev[data-state="error"] { color: #ffd0d8; }
    .qalert { position: fixed; z-index: 40; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(70vw, 120vh); padding: 4vh 3vw; border-radius: 3vh; background: #3a0f1a; border: .5vh solid #ff7a90;
      text-align: center; display: flex; flex-direction: column; gap: 1.6vh; box-shadow: 0 2vh 10vh rgba(0,0,0,.75); }
    .qalert[hidden] { display: none; } .qalert b { font: 800 6vh/1.15 var(--ff); } .qalert span { font: 600 3vh/1.3 var(--ff); color: #ffd479; }
  </style>
  <link rel="stylesheet" href="theme.css?v=9ef27d2c" />
  <link rel="stylesheet" href="signs.css?v=824daaf8" />
</head>
<body>
  <div class="kb-flow" aria-hidden="true"></div>
  <div class="wrap">
    <header><div class="logo">MoHeat <span>Evo</span></div><p id="tag"></p><span class="qdev" id="qdev" data-state="off"><i></i><b></b></span></header>
    <section class="left"><div class="now" id="now"></div><div class="mirror" id="mirror"><span class="tag" id="mtag"></span><div class="sub" id="sub"></div></div></section>
    <section class="right">
      <div class="ears"><canvas id="ears"></canvas><div class="lab" id="earsLab"></div></div>
      <div class="qrbox"><div class="qr" id="qr"></div><p><span id="qrT"></span><small id="qrS"></small></p></div>
      <div class="q-signs ms-row" id="signs" hidden></div>
      <div class="top"><h3 id="topH"></h3><ol id="top"></ol></div>
    </section>
  </div>
  <section class="promo" id="promo" hidden><video id="pv" muted loop playsinline preload="auto"></video>
    <div class="ptag" id="ptag" hidden></div>
    <div class="qbadge" id="qbadge"><div class="qr" id="pqr"></div><p id="pqT"></p><div class="p-signs ms-row" id="psigns" hidden></div></div></section>
  <div class="qalert" id="qalert" role="alert" hidden><b></b><span></span></div>
  <p class="hint">F = fullscreen</p>
  <script>window.MOHEAT_NAV_DATA_ONLY = true;</script>
  <script src="../demos/shared/nav.js?v=798fed66"></script>
  <script src="../demos/shared/kiosk.js?v=a71c2660"></script>
  <script src="qrcode.min.js"></script>
  <script src="pitches.js?v=1cbf44f9"></script>
  <script src="signs.js?v=0849d559"></script>
  <script src="queue.js?v=a0c3f352"></script>
</body>
</html>
