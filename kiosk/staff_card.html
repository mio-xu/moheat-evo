<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoHeat Evo · Staff card</title>
  <meta name="robots" content="noindex" />
  <style>
    /* The booth cheat sheet: one A4 page per language (中文 / 日本語 / English), kiosk style B header. Text: staff_card_data.js. */
    @page { size: A4 portrait; margin: 0; }
    :root { --warm: #ff8a3d; --cool: #5cb8ff; --gold: #ffd479; --ink: #17121f; --dim: #5d5468; --line: #ddd6e3;
      --ff: "Inter", "Noto Sans JP", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
    * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html, body { margin: 0; background: #e9e5ee; color: var(--ink); font-family: var(--ff); }
    .page { width: 210mm; height: 297mm; margin: 8mm auto; padding: 0 9mm 5mm; background: #fff; overflow: hidden; display: flex; flex-direction: column; gap: 1.8mm; box-shadow: 0 2mm 8mm rgba(0, 0, 0, .18); font-size: 11.2pt; line-height: 1.3; }
    .page[lang=ja] { font-size: 11pt; }
    .band { margin: 0 -9mm; padding: 3.6mm 9mm 3.2mm; display: flex; align-items: baseline; gap: 5mm; color: #fff; background: linear-gradient(100deg, #e8681f 0%, #f39a52 30%, #a79bb0 52%, #5aa6e6 72%, #2a78c9 100%); }
    .band b { font-size: 21pt; font-weight: 800; letter-spacing: -.02em; } .band b span { font-weight: 300; } .band i { font-style: normal; font-size: 15pt; font-weight: 700; } .band em { margin-left: auto; font-style: normal; font-size: 12pt; font-weight: 700; }
    .head { display: grid; grid-template-columns: auto 1fr; gap: 1mm 3mm; padding-bottom: 2mm; border-bottom: .4mm solid var(--line); }
    .head dt { font-weight: 800; white-space: nowrap; } .head dd { margin: 0; }
    h2 { margin: 0 0 1mm; font-size: 13pt; font-weight: 800; color: #c4540f; } section:nth-of-type(even) h2 { color: #1f6db8; }
    ol, ul { margin: 0; padding: 0 0 0 6mm; } li { margin: 0 0 .4mm; } ol li::marker { font-weight: 800; }
    code { font: 600 .92em ui-monospace, Menlo, Consolas, monospace; background: #f2eef6; padding: 0 1mm; border-radius: 1mm; overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; } td { padding: .5mm 2mm .5mm 0; vertical-align: top; border-top: .25mm solid var(--line); } td:first-child { width: 25%; font-weight: 700; }
    .noprint { position: fixed; right: 12px; top: 12px; z-index: 5; } .noprint button { font: 600 15px/1 var(--ff); min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; cursor: pointer; }
    @media print { html, body { background: #fff; } .page { margin: 0; box-shadow: none; break-after: page; } .page:last-of-type { break-after: auto; } .noprint { display: none; } }
    @media screen { html.narrow .page { width: auto; height: auto; margin: 0 0 12px; padding: 0 16px 16px; font-size: 16px !important; } html.narrow .band { margin: 0 -16px; padding: 16px; flex-wrap: wrap; } }
  </style>
</head>
<body>
  <div class="noprint"><button type="button" onclick="print()">Print / Save as PDF</button></div>
  <main id="pages"></main>
  <script src="staff_card_data.js?v=518a35e7"></script>
  <script>
    (() => {
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const fmt = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      const sec = (x) => `<section><h2>${esc(x.h)}</h2>${x.steps ? `<ol>${x.steps.map((t) => `<li>${fmt(t)}</li>`).join('')}</ol>` : ''}${x.items ? `<ul>${x.items.map((t) => `<li>${fmt(t)}</li>`).join('')}</ul>` : ''}${x.faq ? `<table>${x.faq.map(([q, a]) => `<tr><td>${fmt(q)}</td><td>${fmt(a)}</td></tr>`).join('')}</table>` : ''}</section>`;
      document.getElementById('pages').innerHTML = Object.values(window.MOHEAT_STAFF_CARD).map((c) => `<article class="page" lang="${c.lang}"><header class="band"><b>MoHeat <span>Evo</span></b><i>${esc(c.title)}</i><em>${esc(c.name)}</em></header>
        <dl class="head">${c.head.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${fmt(v)}</dd>`).join('')}</dl>${c.sections.map(sec).join('')}</article>`).join('');
      // each language must fill exactly one A4 page: shrink that page's text in small steps until nothing is cut off (never below 9.4 pt)
      document.fonts.ready.then(() => { document.querySelectorAll('.page').forEach((p) => { let pt = parseFloat(getComputedStyle(p).fontSize) * .75;
        while (p.scrollHeight > p.clientHeight + 1 && pt > 9.4) { pt -= .1; p.style.fontSize = `${pt}pt`; } p.dataset.pt = pt.toFixed(1); p.dataset.fits = String(p.scrollHeight <= p.clientHeight + 1); });
        document.documentElement.classList.toggle('narrow', innerWidth <= 820); });   // measured at A4 first, so printing from a narrow window still fits
    })();
  </script>
</body>
</html>
