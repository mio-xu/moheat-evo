<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>MoHeat Evo</title>
<meta name="description" content="MoHeat Evo: non-contact thermal headphones. LED heating and ethanol-mist cooling, in sync with sound." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f4f4f2; --card: #ffffff; --ink: #1d2422; --ink-soft: #4c5754; --ink-faint: #6b7672; --line: #e2e4e0;
  --warm: #d9481f; --warm-bg: #fdeee8; --warm-ink: #a8340f;
  --cool: #0e7c86; --cool-bg: #e4f3f4; --cool-ink: #0a626b;
  --stop: #b3261e; --stop-bg: #fcebe9; --on: #1d2422; --on-ink: #ffffff;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161a; --card: #1a2126; --ink: #e9edeb; --ink-soft: #b7c0bc; --ink-faint: #929d97; --line: #2c353b;
    --warm: #ff7a4d; --warm-bg: #33201a; --warm-ink: #ffb097;
    --cool: #3fb6c0; --cool-bg: #14292c; --cool-ink: #84d6dc;
    --stop: #ff8a80; --stop-bg: #36201e; --on: #e9edeb; --on-ink: #11161a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.55; font-family: Archivo, "Noto Sans JP", "Hiragino Kaku Gothic ProN", system-ui, sans-serif; }
html[lang="ja"] body { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", system-ui, sans-serif; }
html[lang="zh"] body { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
.top { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.langs { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.langs button { min-height: 44px; min-width: 64px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-soft); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--on); color: var(--on-ink); }
.cols { display: grid; gap: 22px; }
h1 { margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: clamp(38px, 10vw, 54px); line-height: 1.02; letter-spacing: -.01em; }
.tag { margin: 6px 0 0; font-size: 15px; font-weight: 700; color: var(--ink-soft); }
.bar { height: 5px; border-radius: 3px; margin: 14px 0; background: linear-gradient(90deg, #d9481f, #f08a2e 32%, #c9c2ae 55%, #57a7a5 78%, #0e7c86); }
.intro { margin: 0; font-size: 15.5px; }
.rules { display: grid; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
.rule { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 2px solid; }
.rule svg { flex: none; width: 30px; height: 30px; }
.rule b { display: block; font-size: 17px; line-height: 1.3; }
.rule span { display: block; font-size: 13.5px; line-height: 1.4; color: var(--ink-soft); }
.rule.yes { border-color: var(--cool); background: var(--cool-bg); } .rule.yes svg, .rule.yes b { color: var(--cool-ink); }
.rule.no { border-color: var(--stop); background: var(--stop-bg); } .rule.no svg, .rule.no b { color: var(--stop); }
.rule.photo { border-color: var(--line); background: var(--card); }
section { margin-top: 24px; }
.cols > div > section:first-child { margin-top: 0; }
h2 { margin: 0 0 10px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
html[lang="ja"] h2, html[lang="zh"] h2 { letter-spacing: .04em; font-size: 14px; }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0 0; }
.photos img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: var(--line); }
.hl { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.hl li { padding: 11px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
.hl b { display: block; font-size: 15px; } .hl span { display: block; font-size: 13.5px; color: var(--ink-soft); }
.links { display: grid; gap: 8px; }
.links a { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 9px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); text-decoration: none; }
.links a:hover { border-color: var(--warm); }
.links a:focus-visible, .langs button:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
.links b { display: block; font-size: 15px; } .links span span { display: block; font-size: 12.5px; color: var(--ink-faint); overflow-wrap: anywhere; }
.links svg { flex: none; width: 18px; height: 18px; color: var(--ink-faint); }
.collab { margin: 0 0 10px; font-size: 14.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; padding: 0; list-style: none; }
.chips li { padding: 5px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--warm-ink); background: var(--warm-bg); }
.note { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
footer { margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-faint); }
footer p { margin: 0; }
@media (min-width: 900px) {
  .wrap { padding-top: 22px; }
  .cols { grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: start; }
}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div class="langs" role="group" aria-label="Language" id="langs"></div></div>
  <div class="cols">
    <div>
      <header>
        <h1>MoHeat Evo</h1>
        <p class="tag" data-t="tag"></p>
        <div class="bar" aria-hidden="true"></div>
        <p class="intro" data-t="intro"></p>
      </header>
      <ul class="rules" aria-label="Visitors">
        <li class="rule yes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6.5a1.5 1.5 0 0 0-3 0V11"/><path d="M15 10V4.5a1.5 1.5 0 0 0-3 0V10"/><path d="M12 10.5v-6a1.5 1.5 0 0 0-3 0V12"/><path d="M18 8.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-2c-2.8 0-4.5-1.1-5.9-3.3L3.6 14a1.6 1.6 0 0 1 2.6-1.8L9 14.5V6"/></svg><div><b data-t="r1"></b><span data-t="r1s"></span></div></li>
        <li class="rule no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.7 5.7l12.6 12.6"/></svg><div><b data-t="r2"></b><span data-t="r2s"></span></div></li>
        <li class="rule photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="14" r="3.5"/></svg><div><b data-t="r3"></b><span data-t="r3s"></span></div></li>
      </ul>
      <div class="photos">
        <img src="assets/posters/siggraph-hero.jpg" width="1280" height="720" alt="" data-alt="alt1" />
        <img src="assets/posters/siggraph-asia-2026.jpg" width="1280" height="720" alt="" data-alt="alt2" />
      </div>
      <section aria-labelledby="hl-h">
        <h2 id="hl-h" data-t="hlH"></h2>
        <ul class="hl">
          <li><b data-t="h1"></b><span data-t="h1s"></span></li>
          <li><b data-t="h2"></b><span data-t="h2s"></span></li>
          <li><b data-t="h3"></b><span data-t="h3s"></span></li>
        </ul>
      </section>
    </div>
    <div>
      <section aria-labelledby="l-h">
        <h2 id="l-h" data-t="linksH"></h2>
        <div class="links" id="links"></div>
      </section>
      <section aria-labelledby="c-h">
        <h2 id="c-h" data-t="collabH"></h2>
        <p class="collab" data-t="collab"></p>
        <ul class="chips" id="chips"></ul>
        <p class="note" data-t="collabR"></p>
      </section>
      <footer><p data-t="by"></p><p data-t="joint"></p></footer>
    </div>
  </div>
  <noscript><p>MoHeat Evo: <a href="https://moheat-evo.github.io/">moheat-evo.github.io</a></p></noscript>
</main>
<script>
(() => {

  const T = {

  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>';

  function render(l) {

</body>
</html>
