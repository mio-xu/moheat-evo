<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>MoHeat Evo</title>
<meta name="description" content="MoHeat Evo: non-contact thermal headphones. LED heating and ethanol-mist cooling, in sync with sound." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f4f4f2; --card: #ffffff; --ink: #1d2422; --ink-soft: #4c5754; --ink-faint: #6b7672; --line: #e2e4e0;
  --warm: #d9481f; --cool: #0e7c86; --cool-bg: #e4f3f4; --cool-ink: #0a626b;
  --stop: #b3261e; --stop-bg: #fcebe9; --on: #1d2422; --on-ink: #ffffff;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161a; --card: #1a2126; --ink: #e9edeb; --ink-soft: #b7c0bc; --ink-faint: #929d97; --line: #2c353b;
    --warm: #ff7a4d; --cool: #3fb6c0; --cool-bg: #14292c; --cool-ink: #84d6dc;
    --stop: #ff8a80; --stop-bg: #36201e; --on: #e9edeb; --on-ink: #11161a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; background: var(--bg); color: var(--ink); line-height: 1.4; font-family: Archivo, "Noto Sans JP", "Hiragino Kaku Gothic ProN", system-ui, sans-serif; }
html[lang="ja"] body { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", system-ui, sans-serif; }
html[lang="zh"] body { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
html[lang="ko"] body { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
a { color: inherit; }
/* One screen, no scrolling (user, 2026-11-09): the two device photos take whatever height is left. */
.wrap { width: 100%; max-width: 560px; margin: 0 auto; min-height: min(100vh, 720px); min-height: min(100dvh, 720px); display: flex; flex-direction: column; padding: max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom)); }
.cols { flex: 1; display: grid; grid-template-rows: 1fr auto; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: clamp(26px, 7.6vw, 40px); line-height: 1; letter-spacing: -.01em; white-space: nowrap; }
.langs { flex: none; display: inline-flex; padding: 2px; gap: 1px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.langs button { min-height: 44px; min-width: 44px; padding: 0 9px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-soft); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--on); color: var(--on-ink); }
.intro { margin: 0; font-size: 14.5px; color: var(--ink-soft); }
.devices { flex: 1 1 96px; min-height: 96px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; }
.devices figure { position: relative; margin: 0; overflow: hidden; border-radius: 12px; background: #15181b; }
.devices img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.devices figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 7px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.78)); font-size: 12.5px; line-height: 1.25; }
.devices b { display: block; font-size: 15.5px; }
.devices .w { border-bottom: 3px solid #d9481f; } .devices .c { border-bottom: 3px solid #1f9aa6; }
.rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0; padding: 0; list-style: none; }
.rule { display: flex; flex-direction: column; gap: 2px; padding: 7px 8px; border-radius: 12px; border: 1.5px solid; min-width: 0; }
.rule svg { width: 22px; height: 22px; }
.rule b { font-size: 13.5px; line-height: 1.2; white-space: pre-line; }
.rule span { font-size: 12px; line-height: 1.2; color: var(--ink-soft); }
.rule.yes { border-color: var(--cool); background: var(--cool-bg); } .rule.yes svg, .rule.yes b { color: var(--cool-ink); }
.rule.no { border-color: var(--stop); background: var(--stop-bg); } .rule.no svg, .rule.no b { color: var(--stop); }
.rule.photo { border-color: var(--line); background: var(--card); }
.links { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.links a { grid-column: span 2; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 46px; padding: 4px 6px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); text-decoration: none; font-size: 13.5px; font-weight: 600; line-height: 1.15; }
.links a:nth-child(-n+2) { grid-column: span 3; font-size: 14.5px; }
.links a:nth-child(2) { background: var(--on); color: var(--on-ink); border-color: var(--on); }
.links a:hover { border-color: var(--warm); }
.links a:focus-visible, .langs button:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
.collab { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
footer { font-size: 12px; line-height: 1.3; color: var(--ink-faint); }
footer p { margin: 0; }
@media (max-width: 430px) {   /* four languages (한국어 since 2026-11-11) still fit beside the title on phones */
  h1 { font-size: clamp(24px, 7vw, 32px); }
  .langs button { min-width: 36px; padding: 0 6px; font-size: 12px; }
}
@media (min-width: 900px), (min-width: 560px) and (orientation: landscape) {
  .wrap { max-width: 1040px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  .cols { grid-template-rows: none; grid-template-columns: 1.1fr 1fr; gap: 20px; }
  .col2 { justify-content: center; gap: 10px; }
}
@media (min-width: 900px) and (min-height: 600px) {
  .wrap { max-width: 1180px; min-height: 0; padding-top: 20px; padding-bottom: 20px; }
  .cols { grid-template-columns: 1.3fr 1fr; align-items: center; gap: 44px; } .col { gap: 14px; } .col2 { gap: 18px; }
  .devices { flex: none; }
  .devices figure { aspect-ratio: 1; }
  h1 { font-size: 52px; } .intro { font-size: 17px; }
  .langs button { padding: 0 13px; font-size: 14px; }
  .rule { padding: 11px 12px; gap: 4px; } .rule svg { width: 26px; height: 26px; } .rule b { font-size: 15px; } .rule span { font-size: 13px; }
  .links a { min-height: 56px; font-size: 15px; } .links a:nth-child(-n+2) { font-size: 16px; }
  .collab { font-size: 15px; } footer { font-size: 12.5px; }
}
</style>
</head>
<body>
<main class="wrap">
  <div class="cols">
    <div class="col">
      <header class="top"><h1>MoHeat Evo</h1><div class="langs" role="group" aria-label="Language" id="langs"></div></header>
      <p class="intro" data-t="intro"></p>
      <div class="devices">
        <figure class="w"><img src="assets/images/links/device-warm.webp" width="800" height="666" alt="" data-alt="alt1" /><figcaption><b data-t="warm"></b><span data-t="warmS"></span></figcaption></figure>
        <figure class="c"><img src="assets/images/links/device-cool.webp" width="800" height="666" alt="" data-alt="alt2" /><figcaption><b data-t="cool"></b><span data-t="coolS"></span></figcaption></figure>
      </div>
    </div>
    <div class="col col2">
      <ul class="rules" aria-label="Visitors">
        <li class="rule yes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6.5a1.5 1.5 0 0 0-3 0V11"/><path d="M15 10V4.5a1.5 1.5 0 0 0-3 0V10"/><path d="M12 10.5v-6a1.5 1.5 0 0 0-3 0V12"/><path d="M18 8.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-2c-2.8 0-4.5-1.1-5.9-3.3L3.6 14a1.6 1.6 0 0 1 2.6-1.8L9 14.5V6"/></svg><b data-t="r1"></b><span data-t="r1s"></span></li>
        <li class="rule no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.7 5.7l12.6 12.6"/></svg><b data-t="r2"></b><span data-t="r2s"></span></li>
        <li class="rule photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="14" r="3.5"/></svg><b data-t="r3"></b><span data-t="r3s"></span></li>
      </ul>
      <nav class="links" id="links" aria-label="Links"></nav>
      <p class="collab" data-t="collab"></p>
      <footer><p data-t="by"></p><p data-t="joint"></p></footer>
    </div>
  </div>
  <noscript><p>MoHeat Evo: <a href="https://moheat-evo.github.io/">moheat-evo.github.io</a></p></noscript>
</main>
<script>
(() => {
  const NAMES = { en: 'EN', ja: '日本語', zh: '中文', ko: '한국어' }, KEY = 'moheat.links.lang';
  const T = {
    en: {
      intro: 'Non-contact thermal headphones: warmth and coolness around your ears, in sync with music, stories and games.',
      warm: 'Warmth', warmS: 'LED light', cool: 'Coolness', coolS: 'Ethanol mist',
      alt1: 'Inside the MoHeat Evo ear cup, its LEDs lit', alt2: 'Inside the MoHeat Evo ear cup, a fine mist rising from the nozzle',
      r1: 'Please try it', r1s: 'when staff are here',
      r2: 'Please do not touch', r2s: 'when no staff are here',
      r3: 'Photos OK', r3s: 'Sharing welcome',
      site: 'Project site', demo: 'Try the demos', li: 'LinkedIn', me: 'Personal site', mail: 'Email',
      collab: 'Want to create with temperature? Creators, companies and researchers are welcome to get in touch.',
      by: 'XU Jiayi, Inami-Monnai Lab, RCAST, The University of Tokyo',
      joint: 'Joint research with Suntory Global Innovation Center',
    },
    ja: {
      intro: '肌に触れずに、耳まわりへ温かさと冷たさを届けるヘッドホン。音楽や物語、ゲームと同期します。',
      warm: '温かさ', warmS: 'LEDの光', cool: '冷たさ', coolS: 'エタノールミスト',
      alt1: 'MoHeat Evoのイヤーカップ内部。LEDが点灯している', alt2: 'MoHeat Evoのイヤーカップ内部。ノズルから細かいミストが出ている',
      r1: '体験できます', r1s: 'スタッフ在席時',
      r2: '触らないで\nください', r2s: 'スタッフ不在時',
      r3: '撮影OK', r3s: 'SNS投稿も歓迎',
      site: 'プロジェクトサイト', demo: 'デモを体験', li: 'LinkedIn', me: '個人サイト', mail: 'メール',
      collab: '温度を使った作品づくりや共同研究のパートナーを募集しています。お気軽にご連絡ください。',
      by: 'XU Jiayi（許 佳禕）東京大学 先端研 稲見・門内研究室',
      joint: 'サントリーグローバルイノベーションセンターとの共同研究',
    },
    zh: {
      intro: '不接触皮肤，在耳朵周围带来温暖与清凉的耳机，与音乐、故事、游戏同步。',
      warm: '温暖', warmS: 'LED 光', cool: '清凉', coolS: '乙醇雾',
      alt1: 'MoHeat Evo 耳罩内部，LED 亮起', alt2: 'MoHeat Evo 耳罩内部，喷口冒出细雾',
      r1: '欢迎体验', r1s: '有工作人员时',
      r2: '请勿触摸', r2s: '没有工作人员时',
      r3: '可以拍照', r3s: '欢迎分享',
      site: '项目网站', demo: '体验 Demo', li: 'LinkedIn', me: '个人网站', mail: '邮箱',
      collab: '欢迎内容创作者、企业和研究机构与我们合作，一起创作带有温度的内容。',
      by: 'XU Jiayi（许佳祎），东京大学 先端研 稻见・门内研究室',
      joint: '与三得利全球创新中心的联合研究',
    },
    ko: {
      intro: '피부에 닿지 않고 귀 주변에 따뜻함과 시원함을 전하는 헤드폰. 음악, 이야기, 게임과 함께 움직입니다.',
      warm: '따뜻함', warmS: 'LED 빛', cool: '시원함', coolS: '에탄올 미스트',
      alt1: 'MoHeat Evo 이어컵 안쪽, LED가 켜져 있다', alt2: 'MoHeat Evo 이어컵 안쪽, 노즐에서 고운 미스트가 나온다',
      r1: '체험해 보세요', r1s: '스태프가 있을 때',
      r2: '만지지 말아 주세요', r2s: '스태프가 없을 때',
      r3: '사진 촬영 OK', r3s: 'SNS 공유 환영',
      site: '프로젝트 사이트', demo: '데모 체험', li: 'LinkedIn', me: '개인 사이트', mail: '이메일',
      collab: '온도로 함께 작품을 만들 크리에이터, 기업, 연구자 분들의 연락을 기다립니다.',
      by: 'XU Jiayi, 도쿄대학 첨단과학기술연구센터 이나미·몬나이 연구실',
      joint: '산토리 글로벌 이노베이션 센터와의 공동 연구',
    },
  };
  const LINKS = [
    ['site', 'https://moheat-evo.github.io/'],
    ['demo', 'https://moheat-evo.github.io/#thermalDemo'],
    ['li', 'https://www.linkedin.com/in/jiayi-xu-b25979446/'],
    ['me', 'https://jiayi-xu-hci.github.io/'],
    ['mail', 'mailto:xu.jiayi@star.rcast.u-tokyo.ac.jp'],
  ];
  const langs = document.getElementById('langs'), links = document.getElementById('links');
  const load = () => { try { const v = localStorage.getItem(KEY); return T[v] ? v : 'en'; } catch { return 'en'; } };
  const save = (v) => { try { localStorage.setItem(KEY, v); } catch {} };
  const el = (tag, text) => { const e = document.createElement(tag); e.textContent = text; return e; };
  function render(l) {
    const t = T[l]; document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach((e) => { e.textContent = t[e.dataset.t]; });
    document.querySelectorAll('[data-alt]').forEach((e) => { e.alt = t[e.dataset.alt]; });
    langs.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.l === l)));
    links.replaceChildren(...LINKS.map(([k, href]) => { const a = document.createElement('a'); a.href = href; if (href.startsWith('http')) { a.target = '_blank'; a.rel = 'noopener'; }
      a.textContent = t[k]; return a; }));
  }
  langs.append(...Object.keys(T).map((l) => { const b = el('button', NAMES[l]); b.type = 'button'; b.dataset.l = l; b.lang = l; b.addEventListener('click', () => { save(l); render(l); }); return b; }));
  render(load());
})();
</script>
</body>
</html>
