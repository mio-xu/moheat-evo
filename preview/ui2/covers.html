<!doctype html>
<!-- UI v2 COVER WALL (user 2026-11-08, step G1): every demo's finished cover (tools/web/covers.py) in one grid, per language, in the
     wide and compact layouts, plus the menu thumbnail made from the same image. Data: demos/shared/nav.js DEMOS. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>UI v2 cover wall</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg: #0e0d14; --fg: #ece8f4; --dim: #9a94a8; --line: #2a2733; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 "Inter", "Noto Sans JP", sans-serif; }
  header { padding: 20px 20px 6px; } h1 { margin: 0 0 4px; font-size: 22px; } header p { margin: 0; color: var(--dim); }
  nav { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  nav button, nav a { font: inherit; color: var(--fg); background: #1d1b25; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none; }
  nav button[aria-pressed=true] { background: var(--fg); color: #111; }
  nav .sep { width: 12px; }
  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--w, 420px)), 1fr)); gap: 14px; padding: 16px 20px 40px; }
  figure { margin: 0; } img { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 6px; background: #000; object-fit: cover; }
  figcaption { font-size: 12px; color: var(--dim); margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; }
  h2 { grid-column: 1 / -1; margin: 10px 0 0; font-size: 14px; color: var(--dim); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
</style></head><body>
<header><h1>MoHeat Evo · cover wall</h1><p>Every cover is made by one template from a data record + one picture. Switch language and layout; nothing is drawn per demo.</p></header>
<nav id="nav"><button data-l="en" aria-pressed="true">English</button><button data-l="ja">日本語</button><button data-l="zh">中文</button><span class="sep"></span>
  <button data-v="w1280" aria-pressed="true">Wide (desktop)</button><button data-v="c1200">Compact (phone)</button><button data-v="thumb">Menu thumbnail</button>
  <span style="flex:1"></span><a href="specimen.html">← UI specimen</a></nav>
<main class="wall" id="wall"></main>
<script>
const CAT = { 'all-ages': 'All ages', healing: 'Healing', 'for-men': 'For men', 'for-women': 'For women', 'nobunaga-suntory': 'Nobunaga series' };
let lang = 'en', view = 'w1280'; try { lang = localStorage.getItem('moheat.sublang') || 'en'; } catch {}
(async () => {
  const src = await (await fetch('../../demos/shared/nav.js')).text();
  const demos = [...src.matchAll(/\{ cat: '([^']+)', dir: '([^']+)', ja: '([^']*)', en: ("[^"]*"|'[^']*'), zh: '([^']*)'/g)].map((m) => ({ cat: m[1], dir: m[2], ja: m[3], en: m[4].slice(1, -1), zh: m[5] }));
  const paint = () => {
    document.querySelectorAll('#nav [data-l]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.l === lang)));
    document.querySelectorAll('#nav [data-v]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === view)));
    document.body.style.setProperty('--w', view === 'thumb' ? '240px' : view === 'c1200' ? '374px' : '420px');
    let last = '';
    document.getElementById('wall').innerHTML = demos.map((d) => { const head = d.cat !== last ? `<h2>${CAT[d.cat]}</h2>` : ''; last = d.cat;
      const f = view === 'thumb' ? 'w1280' : view;
      return `${head}<figure><img loading="lazy" ${view === 'thumb' ? 'style="width:240px;height:135px"' : ''} src="../../demos/${d.cat}/${d.dir}/media/cover/${lang}.${f}.webp" alt=""><figcaption><span>${d[lang]}</span><span>${d.dir.split('_')[0]}</span></figcaption></figure>`; }).join('');
  };
  document.getElementById('nav').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.l) { lang = b.dataset.l; try { localStorage.setItem('moheat.sublang', lang); } catch {} } if (b.dataset.v) view = b.dataset.v; paint(); });
  paint();
})();
</script></body></html>
