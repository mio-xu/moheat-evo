<!doctype html>
<!-- UI v2 SPECIMEN (user 2026-11-08, step G1: approve before rollout): every component and state of the one shared interface,
     3 languages, desktop + phone. Each frame is preview/ui2/stage.html (the real demos/shared/ui2.js + ui2.css, a mock adapter). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>UI v2 specimen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg: #0e0d14; --fg: #ece8f4; --dim: #9a94a8; --line: #2a2733; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "Inter", "Noto Sans JP", sans-serif; }
  header { padding: 24px 24px 8px; } h1 { margin: 0 0 4px; font-size: 22px; } header p { margin: 0; color: var(--dim); max-width: 920px; }
  nav { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 24px; display: flex; gap: 8px; flex-wrap: wrap; }
  nav button, nav a { font: inherit; color: var(--fg); background: #1d1b25; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none; }
  nav button[aria-pressed=true] { background: var(--fg); color: #111; }
  section { padding: 18px 24px 8px; } h2 { font-size: 16px; margin: 0 0 12px; color: var(--dim); font-weight: 600; letter-spacing: .04em; }
  .grid { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
  figure { margin: 0; } figcaption { font-size: 13px; color: var(--dim); margin-top: 6px; }
  iframe { border: 0; display: block; background: #000; border-radius: 6px; }
  .d iframe { width: 1024px; height: 576px; } .t iframe { width: 760px; height: 427.5px; } .p iframe { width: 374px; height: 210.4px; }
  .phone { width: 390px; padding: 8px; border: 1px solid var(--line); border-radius: 22px; background: #000; }
  .phone .pg { height: 120px; display: grid; place-items: center; color: var(--dim); font-size: 12px; border-top: 1px dashed var(--line); }
  table { border-collapse: collapse; font-size: 14px; } td, th { border: 1px solid var(--line); padding: 6px 10px; text-align: left; } th { color: var(--dim); font-weight: 600; }
  .ic { display: flex; gap: 16px; flex-wrap: wrap; } .ic div { width: 96px; text-align: center; font-size: 12px; color: var(--dim); } .ic svg { width: 36px; height: 36px; fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; margin: 0 auto 6px; }
</style></head><body>
<header><h1>MoHeat Evo · UI v2 specimen</h1>
<p>One interface for every demo. Only the picture and the title text differ between demos; every control below is the same element, size, wording and colour in all of them. Category accent colour comes from the category style card.</p></header>
<nav id="lang"><button data-l="en" aria-pressed="true">English</button><button data-l="ja">日本語</button><button data-l="zh">中文</button>
  <span style="flex:1"></span><a href="covers.html">Cover wall →</a></nav>
<main id="main"></main>
<script src="../../demos/shared/ui2.js"></script>
<script>
const D = 'demos/for-women/Demo24_GakuCamp', TALK = 'demos/nobunaga-suntory/Demo23_NobunagaTalk', INN = 'demos/for-men/Demo43_BlizzardInn';
const SECTIONS = [
  ['Desktop · 1024 px player', 'd', [
    ['Cover (= loading done)', { state: 'cover' }], ['Loading: the cover shows at once, Start waits', { state: 'loading' }],
    ['Playing — subtitles + answers sit above the bar', { state: 'playing', answers: 1 }], ['Paused', { state: 'paused' }],
    ['Ended = own cover: Play again · mode · endings', { state: 'ended', endings: 1 }], ['⚙ Settings', { state: 'playing', pop: 'set' }],
    ['🔊 Volume', { state: 'playing', pop: 'vol' }], ['🌡 Thermal on/off + intensity', { state: 'playing', pop: 'heat' }],
    ['Thermal off (bar icon struck through)', { state: 'playing', heat: 0 }], ['Just-listen mode', { state: 'playing', mode: 'pure' }],
    ['Option row (talk demos): one picker per group', { state: 'cover', demo: TALK }], ['Two groups (Demo43 “keep talking”, end cover)', { state: 'ended', demo: INN }]]],
  ['Tablet / phone landscape · 760 px player (smallest wide layout, touch)', 't', [['Cover', { state: 'cover', touch: 1 }], ['Playing', { state: 'playing', touch: 1, answers: 1 }]]],
  ['Phone portrait · 374 px player (compact cover, touch)', 'p', [['Cover', { state: 'cover', touch: 1 }], ['Playing', { state: 'playing', touch: 1 }], ['Paused', { state: 'paused', touch: 1 }],
    ['Ended', { state: 'ended', touch: 1, endings: 1 }], ['⚙ Settings', { state: 'playing', touch: 1, pop: 'set' }], ['Talk demo cover', { state: 'cover', touch: 1, demo: TALK }]]],
];
let lang = 'en'; try { lang = localStorage.getItem('moheat.sublang') || 'en'; } catch {}
const url = (o) => 'stage.html?' + new URLSearchParams({ demo: o.demo || D, lang, ...Object.fromEntries(Object.entries(o).filter(([k]) => k !== 'demo')) });
function render() {
  document.querySelectorAll('#lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.l === lang)));
  const T = MoHeatUI2.T, keys = ['start', 'again', 'inter', 'pure', 'play', 'pause', 'volume', 'thermal', 'intensity', 'settings', 'full', 'language', 'subs', 'size', 'motion', 'hide', 'device', 'connect', 'head', 'endings', 'locked'];
  document.getElementById('main').innerHTML = SECTIONS.map(([h, cls, items]) => `<section class="${cls}"><h2>${h}</h2><div class="grid">${items.map(([cap, o]) =>
      `<figure><iframe loading="lazy" src="${url(o)}" title="${cap}"></iframe><figcaption>${cap}</figcaption></figure>`).join('')}</div></section>`).join('')
    + `<section><h2>Icon set (one set, 24 grid, 2 px stroke)</h2><div class="ic">${Object.entries(MoHeatUI2.I).map(([k, v]) => `<div>${v}${k}</div>`).join('')}</div></section>`
    + `<section><h2>Wording (EN default · 日本語 · 中文; Korean = one more column)</h2><table><tr><th>key</th><th>English</th><th>日本語</th><th>中文</th></tr>${keys.map((k) => `<tr><td>${k}</td><td>${T[k].en}</td><td>${T[k].ja}</td><td>${T[k].zh}</td></tr>`).join('')}</table></section>`;
}
document.getElementById('lang').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; lang = b.dataset.l; try { localStorage.setItem('moheat.sublang', lang); } catch {} render(); });
render();
</script></body></html>
