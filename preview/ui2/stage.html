<!doctype html>
<!-- UI v2 preview: ONE player with the shared interface in a chosen state (mock adapter, no demo code). Used by specimen.html.
     stage.html?demo=demos/<cat>/<dir>&lang=en|ja|zh&state=loading|cover|playing|paused|ended&pop=set|vol|heat&mode=interactive|pure&touch=1 -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>UI v2 stage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../demos/shared/ui2.css">
<style>
  html, body { margin: 0; background: #0b0a12; height: 100%; overflow: hidden; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
  .scene { position: absolute; inset: 0; background: center / cover no-repeat; }
  /* stand-ins for the demo's own subtitle / answer markup (DEMO_DESIGN_GUIDE §7.3 3), styled as series.css does */
  .subs { position: absolute; left: 5%; right: 5%; display: flex; flex-direction: column; align-items: center; gap: .35cqw; pointer-events: none; z-index: 20; }
  .subs .line { margin: 0; padding: .22em .75em; border-radius: .5em; background: rgba(8, 6, 14, .62); color: #fff; text-align: center; font-family: "Noto Sans JP", sans-serif; }
  .subs .one { font-size: clamp(10.5px, 2cqw, 30px); line-height: 1.3; }
  @container (max-width: 620px) { .subs .one { font-size: 3.2cqw; } }
  .subs .who { font-style: normal; color: #ffd479; margin-right: .5em; font-weight: 700; }
  .choices { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 1cqw; z-index: 21; }
  .choices .ch { min-height: 44px; font: 600 clamp(12px, 1.3cqw, 22px)/1.2 "Inter", "Noto Sans JP", sans-serif; padding: .6em 1.3em; border-radius: .7em; border: 1px solid rgba(255,255,255,.5); background: rgba(10,8,16,.6); color: #fff; }
  .u2[data-state="cover"] ~ *, .u2[data-state="loading"] ~ *, .u2[data-state="ended"] ~ * { }
</style></head>
<body>
<div class="stage" id="stage"><div class="scene"></div>
  <div class="subs" id="subs" hidden><p class="line"><span class="one"><em class="who"></em><span class="txt"></span></span></p></div>
  <div class="choices" hidden></div>
</div>
<script src="../../demos/shared/ui2.js"></script>
<script>
(async () => {
  const Q = new URLSearchParams(location.search), demo = Q.get('demo') || 'demos/for-women/Demo24_GakuCamp';
  let lang = Q.get('lang') || 'en', state = Q.get('state') || 'cover', mode = Q.get('mode') || 'interactive';
  const D = await (await fetch(`../../${demo}/cover.json`)).json();
  const st = { vol: .8, heat: Q.get('heat') !== '0', int: .6, subs: 'm', reduced: false, hide: false, fs: false, sel: {} };
  (D.options || []).forEach((o) => { st.sel[o.key] = o.items[1]?.v ?? o.items[0].v; });
  const CH = [{ en: 'Arrival', ja: '到着', zh: '抵达' }, { en: 'By the fire', ja: '焚き火のそば', zh: '篝火旁' }, { en: 'The lake wind', ja: '湖の風', zh: '湖风' },
    { en: 'Coffee', ja: 'コーヒー', zh: '咖啡' }, { en: 'Stargazing', ja: '星を見る', zh: '看星星' }, { en: 'Good night', ja: 'おやすみ', zh: '晚安' }];
  const SUB = { who: { en: 'Gaku', ja: 'ガク', zh: '岳' }, txt: { en: 'Come closer — the fire is warmer on this side.', ja: 'もっとこっちおいで。こっちのほうが火があったかい。', zh: '再靠近一点——这边的火更暖和。' } };
  const ANS = [{ en: 'Move closer', ja: '近づく', zh: '靠近' }, { en: 'Stay here', ja: 'ここにいる', zh: '待在这里' }];
  const scene = document.querySelector('.scene'); scene.style.backgroundImage = `url("../../${demo}/media/cover/art.webp")`;
  const pick = (o) => o[lang] ?? o.en;
  const showStory = () => {
    const live = state === 'playing' || state === 'paused';
    document.getElementById('subs').hidden = !live;
    document.querySelector('.subs .who').textContent = pick(SUB.who); document.querySelector('.subs .txt').textContent = pick(SUB.txt);
    const c = document.querySelector('.choices'); c.hidden = !(live && Q.has('answers')); c.innerHTML = ANS.map((a) => `<button class="ch">${pick(a)}</button>`).join('');
  };
  const A = {
    cat: demo.split('/')[1], touch: Q.has('touch'),
    cover: { base: `../../${demo}/media/cover/`, langs: ['en', 'ja', 'zh'] },
    state: () => state, lang: () => lang, setLang: (l) => { lang = l; showStory(); },
    mode: () => mode, setMode: (m) => { mode = m; },
    start: () => { state = 'playing'; showStory(); ui.paint(); }, togglePause: () => { state = state === 'paused' ? 'playing' : 'paused'; ui.paint(); },
    chapters: () => CH.map((c) => ({ label: c })), chapter: () => (state === 'ended' ? 5 : 2), progress: () => .42, reached: () => 3, seek: () => {},
    volume: () => st.vol, setVolume: (v) => { st.vol = v; }, heat: () => st.heat, setHeat: (v) => { st.heat = v; },
    intensity: () => st.int, setIntensity: (v) => { st.int = v; }, subs: () => st.subs, setSubs: (v) => { st.subs = v; },
    reduced: () => st.reduced, setReduced: (v) => { st.reduced = v; }, autohide: () => st.hide, setAutohide: (v) => { st.hide = v; },
    device: () => (Q.has('touch') ? { serial: false } : { serial: true, connected: Q.has('dev'), name: 'MoHeat Evo · L+R' }), connect: () => {},
    fullscreen: () => st.fs, toggleFullscreen: () => { st.fs = !st.fs; },
    endings: () => (Q.has('endings') ? { got: 1, total: 2 } : null),
    options: () => (D.options || []).filter((o) => !o.when || o.when === state).map((o) => ({ key: o.key, label: o.label, items: o.items.map((it) => ({ v: it.v, label: it.label, on: st.sel[o.key] === it.v })) })),
    pick: (k, v) => { st.sel[k] = v; },
    loaded: () => (state === 'loading' ? .64 : 1),
  };
  const ui = MoHeatUI2.mount(document.getElementById('stage'), A);
  showStory();
  if (Q.get('pop') === 'opt') { const el = [...ui.root.querySelectorAll('.u2-pick')].find((e) => e.offsetParent); if (el) ui.open('opt', el); }
  else if (Q.get('pop')) ui.open(Q.get('pop'));
  document.documentElement.dataset.ready = '1';
})();
</script>
</body></html>
