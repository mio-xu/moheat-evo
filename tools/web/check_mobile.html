<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobile one-screen check</title>
<!--
  One-screen / phone check for every demo in demos/shared/nav.js DEMOS (DEMO_DESIGN_GUIDE §7.1 / §7.3).
  Usage:  python3 -m http.server 8765   (repo root)   →   open http://127.0.0.1:8765/tools/web/check_mobile.html
          ?only=Demo21,Demo05   only these folders (substring match)
          ?sizes=390x844,844x390   other sizes (default: the 4 phone / tablet sizes + 3 desktop sizes)
          ?guide=0 / ?play=0       skip the guide tour / the "after Start" pass
          ?fs=0                    skip the phone ⛶ check (390×844 / 844×390: picture fills, rotate card upright, none sideways)
          ?resume=1                continue an interrupted run (results are kept in localStorage per sizes/only; the tab may be closed by others)
          ?serial=1                keep the device controls (a browser WITH Web Serial in a narrow window, e.g. desktop Chrome)
  Each demo is loaded in a same-origin iframe of the given size (window resizing does not work in a maximised Chrome, §11.1).
  Sizes ≤ 1100 px wide get html.no-serial (like a real phone / iPad: no Web Serial). Audio is muted.
  Checked: page scroll (scrollHeight > innerHeight) and horizontal overflow, the stage size, visible tap targets < 44 px
  (phones / tablets only), controls outside the screen, and every guide step (tooltip + its buttons on screen, ≥ 44 px on touch,
  not covering the highlighted element, the highlighted element on screen). Results: the table + window.RESULTS (JSON).
-->
<style>
  body { font: 13px/1.4 system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  table { border-collapse: collapse; } td, th { border: 1px solid #333; padding: 3px 6px; vertical-align: top; }
  .ok { color: #7d7; } .bad { color: #f77; } #box { position: fixed; left: -5000px; top: 0; }
  small { color: #aaa; }
</style></head><body>
<h1>Mobile one-screen check</h1><p id="st">loading…</p><table id="t"></table><div id="box"></div>
<script>
const QS = new URLSearchParams(location.search);
const SIZES = (QS.get('sizes') || '390x844,844x390,768x1024,1024x768,1280x720,1440x900,1920x1080').split(',').map((s) => s.split('x').map(Number));
const ONLY = (QS.get('only') || '').split(',').filter(Boolean);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
window.RESULTS = [];

function load(url, w, h) {
  return new Promise((res) => {
    const f = document.createElement('iframe'); f.width = w; f.height = h; f.style.border = '0';
    f.onload = () => res(f); f.src = url; document.getElementById('box').appendChild(f);
  });
}
function mute(win) {   // no sound while testing
  try {
    const AC = win.AudioContext || win.webkitAudioContext;
    if (AC && !AC.__muted) { const R = AC.prototype.resume; AC.prototype.resume = function () { return Promise.resolve(); }; AC.__muted = 1;
      const C = function (...a) { const c = new AC(...a); try { c.suspend(); } catch {} return c; }; C.prototype = AC.prototype; win.AudioContext = win.webkitAudioContext = C; }
    win.HTMLMediaElement.prototype.play = function () { this.muted = true; this.volume = 0; return Promise.resolve(); };
  } catch {}
}
const name = (el) => (el.id ? '#' + el.id : el.tagName.toLowerCase() + (el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/).slice(0, 2).join('.') : '')) + (el.textContent ? ` "${el.textContent.trim().slice(0, 14)}"` : '');
function shown(win, el) {
  const r = el.getBoundingClientRect(); if (r.width < 2 || r.height < 2) return false;
  for (let e = el; e && e.nodeType === 1; e = e.parentElement) { const cs = win.getComputedStyle(e); if (cs.display === 'none' || cs.visibility === 'hidden' || +cs.opacity === 0 || cs.pointerEvents === 'none' && e === el) return false; }
  return true;
}
// a real hit test: a finger anywhere in the 44 × 44 px square around the control's centre reaches it (an invisible ::before hit area counts;
// a checkbox counts with its <label>). Points outside the screen or covered by something else fail.
function tappable(doc, el) {
  const t = el.matches('input[type=checkbox], input[type=radio]') && el.closest('label') || el, r = t.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  return [[0, 0], [-21, 0], [21, 0], [0, -21], [0, 21]].every(([dx, dy]) => { const h = doc.elementFromPoint(cx + dx, cy + dy); return h && (t.contains(h) || el.contains(h) || !!h.closest('.mv-pill')); });   // the voice pill (shared/voice.js) floats over its answers on purpose
}
function measure(f, touch, scope) {
  const win = f.contentWindow, doc = f.contentDocument, se = doc.scrollingElement, W = win.innerWidth, H = win.innerHeight;
  const out = { scrollY: se.scrollHeight - H, scrollX: se.scrollWidth - W };
  const st = doc.querySelector('.stage-col .stage') || doc.querySelector('.stage');
  if (st) { const r = st.getBoundingClientRect(); out.stage = `${Math.round(r.width)}×${Math.round(r.height)}`; out.stageArea = Math.round(100 * r.width * r.height / (W * H)); }
  const small = [], off = [];
  (scope ? doc.querySelector(scope) : doc).querySelectorAll('button, a[href], input, select, [role=button], .act-btn, .ch').forEach((el) => {
    if (!shown(win, el) || el.closest('.mg-tip, .dn-panel, [hidden]')) return;
    const R = doc.documentElement; if (el.closest('aside.side') && R.classList.contains('lay-drawer') && !R.classList.contains('side-open')) return;   // inside the closed drawer
    const r = el.getBoundingClientRect();
    if (el.closest('.intro.hidden') || (R.classList.contains('ui2') && el.closest('.intro, .transport'))) return;   // UI v2: the old cover is invisible, its buttons are driven by the shared interface
    // clipped by a scrolling / overflow-hidden ancestor (side panel scrolls inside itself) → not "off-screen"
    let clip = null; for (let e = el.parentElement; e && e !== doc.body; e = e.parentElement) { const cs = win.getComputedStyle(e); if (cs.overflowY !== 'visible' || cs.overflowX !== 'visible') { clip = e; break; } }
    const cr = clip ? clip.getBoundingClientRect() : { top: 0, left: 0, right: W, bottom: H };
    const inScroller = clip && (clip.scrollHeight > clip.clientHeight + 1);
    if (!inScroller && (r.right > W + 1 || r.bottom > H + 1 || r.left < -1 || r.top < -1 || r.bottom > cr.bottom + 1 || r.right > cr.right + 1)) off.push(name(el));
    if (!touch) return;
    if (inScroller) (el.closest('label') || el).scrollIntoView({ block: 'nearest', inline: 'nearest' });   // a control further down the side panel: scroll it into view first
    const q = el.getBoundingClientRect(), hit = doc.elementFromPoint(q.left + q.width / 2, q.top + q.height / 2);
    if (!hit || !(el.contains(hit) || el.closest('label')?.contains(hit))) { out.covered = (out.covered || 0) + 1; return; }   // under the cover / another layer: not on screen for the user
    if (!tappable(doc, el)) small.push(`${name(el)} ${Math.round(q.width)}×${Math.round(q.height)}`);
  });
  out.small = small; out.off = off;
  return out;
}
async function guide(f, touch) {
  const win = f.contentWindow, doc = f.contentDocument, G = win.MoHeatGuide; if (!G) return { err: 'no guide' };
  G.start(); await wait(350);
  const issues = []; let n = 0;
  for (let k = 0; k < 14; k++) {
    const tip = doc.querySelector('.mg-tip'); if (!tip) break; n++;
    await wait(320);
    const W = win.innerWidth, H = win.innerHeight, t = tip.getBoundingClientRect(), hole = doc.querySelector('.mg-hole').getBoundingClientRect();
    const step = tip.querySelector('.mg-n')?.textContent;
    if (t.left < 0 || t.top < 0 || t.right > W + .5 || t.bottom > H + .5) issues.push(`${step}: tip off-screen (${Math.round(t.top)}..${Math.round(t.bottom)} of ${H})`);
    tip.querySelectorAll('button').forEach((b) => { const r = b.getBoundingClientRect();
      if (r.top < 0 || r.bottom > H || r.left < 0 || r.right > W) issues.push(`${step}: button "${b.textContent}" off-screen`);
      if (touch && r.height < 43.5) issues.push(`${step}: button "${b.textContent}" ${Math.round(r.height)}px`);
      const hit = doc.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2); if (!b.contains(hit)) issues.push(`${step}: button "${b.textContent}" covered`); });
    if (hole.width > 1) {
      const ov = Math.max(0, Math.min(t.right, hole.right) - Math.max(t.left, hole.left)) * Math.max(0, Math.min(t.bottom, hole.bottom) - Math.max(t.top, hole.top));
      const big = hole.width * hole.height > W * H * .25;   // a big target (the whole stage / side panel) may be partly covered
      if (ov > 0 && !big) issues.push(`${step}: tip covers the highlighted element`);
      if (ov > hole.width * hole.height * .6) issues.push(`${step}: tip hides most of the highlighted element`);
      if (hole.bottom < 8 || hole.top > H - 8 || hole.right < 8 || hole.left > W - 8) issues.push(`${step}: highlighted element off-screen`);
    }
    const go = tip.querySelector('.mg-go'); go.click();
  }
  if (doc.querySelector('.mg-tip')) { issues.push('tour did not end'); G.close(); }
  return { steps: n, issues };
}
// phone ⛶ (shared/fullscreen.js, §7.1): the picture = the largest 16:9 on screen, ⛶ / ⤡ reachable; upright → the "turn your phone" card
// (its button on screen, 44 px, tappable), sideways → no card; leaving fullscreen removes it. The iframe is not a real phone → testPhone.
async function fullscreen(f) {
  const win = f.contentWindow, doc = f.contentDocument, F = win.MoHeatFullscreen, issues = []; if (!F) return { issues: ['no MoHeatFullscreen'] };
  F.testPhone = true; F.set(true); await wait(1900);
  const W = win.innerWidth, H = win.innerHeight, st = (doc.querySelector('.stage-col .stage') || doc.querySelector('.stage')).getBoundingClientRect();
  const fit = Math.min(W, H * 16 / 9); if (Math.abs(st.width - fit) > 2 || st.left < -1 || st.top < -1 || st.right > W + 1 || st.bottom > H + 1) issues.push(`picture ${Math.round(st.width)}×${Math.round(st.height)} (want ${Math.round(fit)} wide, on screen)`);
  const card = doc.querySelector('.mfs-rot'), upright = H > W;
  if (upright && !card) issues.push('no rotate card in portrait');
  if (!upright && card) issues.push('rotate card in landscape');
  const b = upright ? card?.querySelector('button') : doc.querySelector('.mfs-btn');
  if (b) { const r = b.getBoundingClientRect(), hit = doc.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    if (r.left < 0 || r.top < 0 || r.right > W || r.bottom > H) issues.push(`${upright ? 'continue-in-portrait' : '⤡'} off-screen`);
    if (!b.contains(hit) && !tappable(doc, b)) issues.push(`${upright ? 'continue-in-portrait' : '⤡'} covered`);
    if (upright && r.height < 43.5) issues.push(`continue-in-portrait ${Math.round(r.height)}px`); }
  if (doc.scrollingElement.scrollHeight > H || doc.scrollingElement.scrollWidth > W) issues.push('page scrolls in fullscreen');
  F.set(false); await wait(300); F.testPhone = false;
  if (doc.querySelector('.mfs-rot') || doc.documentElement.classList.contains('mfs')) issues.push('card / fullscreen left over after exit');
  return { issues };
}
async function play(f) {
  const doc = f.contentDocument, b = doc.querySelector('.u2-start') || doc.getElementById('startBtn');
  if (!b || !shown(f.contentWindow, b)) return false;
  b.click(); await wait(2200); return true;
}
// fill the demo's own empty .choices / .act boxes with sample buttons (its real CSS), show them, measure, remove them again
async function answers(f, touch) {   // one box at a time (a demo shows either answers or an action, never both)
  const doc = f.contentDocument, out = { small: [], off: [] }; let any = false;
  if ([...doc.querySelectorAll('.stage :is(.ch, .act-btn)')].some((e) => shown(f.contentWindow, e))) return null;   // the demo already shows its own answers: measured by measure()
  for (const [sel, html] of [['.stage .choices', '<button class="ch" type="button"><b>もちろん</b><span>Of course</span></button><button class="ch" type="button"><b>ちょっと待って</b><span>Wait a moment</span></button><button class="ch" type="button"><b>いいえ</b><span>No</span></button>'],
    ['.stage .act', '<button class="act-btn hold" type="button"><i>✋</i><b>長押し</b><span>Hold</span></button>']]) {
    const box = doc.querySelector(sel); if (!box || box.children.length) continue;
    box.innerHTML = html; box.classList.add('show'); any = true;
    await wait(600);   // its show transition
    const W = f.contentWindow.innerWidth, H = f.contentWindow.innerHeight, st = (doc.querySelector('.stage-col .stage') || doc.querySelector('.stage')).getBoundingClientRect();
    box.querySelectorAll('button').forEach((el) => { const r = el.getBoundingClientRect();
      if (r.left < st.left - 1 || r.right > st.right + 1 || r.top < st.top - 1 || r.bottom > st.bottom + 1 || r.bottom > H || r.right > W) out.off.push(name(el));
      if (touch && !tappable(doc, el)) out.small.push(`${name(el)} ${Math.round(r.width)}×${Math.round(r.height)}`); });
    box.innerHTML = ''; box.classList.remove('show');
  }
  return any ? out : null;
}

(async () => {
  if (QS.has('view')) {   // ?view=Demo21[&sizes=…][&guide=1]: just show that demo at every size, to look at (no measuring)
    document.getElementById('box').style.cssText = 'position:static;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start';
    document.querySelector('table').remove(); document.getElementById('st').textContent = '';
    const src = await (await fetch('../../demos/shared/nav.js')).text(), m = src.match(new RegExp(`cat: '([^']+)', dir: '([^']*${QS.get('view')}[^']*)'`));
    try { QS.has('guide') ? localStorage.removeItem('moheat.guide') : localStorage.setItem('moheat.guide', 'done'); } catch {}
    for (const [w, h] of SIZES.filter(([w]) => w <= 1100 || QS.has('sizes'))) {
      const f = await load(`../../demos/${m[1]}/${m[2]}/${QS.has('play') ? '?' : ''}`, w, h); mute(f.contentWindow); f.style.outline = '1px solid #555';
      if (w <= 1100 && !QS.has('serial')) { f.contentDocument.documentElement.classList.add('no-serial'); f.contentWindow.dispatchEvent(new Event('resize')); }
    }
    window.DONE = true; return;
  }
  const src = await (await fetch('../../demos/shared/nav.js')).text();
  const demos = [...src.matchAll(/\{ cat: '([^']+)', dir: '([^']+)'/g)].map((m) => ({ cat: m[1], dir: m[2] }))
    .filter((d) => !ONLY.length || ONLY.some((o) => d.dir.includes(o)));
  const t = document.getElementById('t');
  t.innerHTML = `<tr><th>demo</th>${SIZES.map(([w, h]) => `<th>${w}×${h}</th>`).join('')}</tr>`;
  try { localStorage.setItem('moheat.guide', 'done'); } catch {}   // no automatic tour; started by hand below
  let bad = 0;
  const KEEP = 'checkmobile:' + SIZES.map((s) => s.join('x')).join(',') + ':' + ONLY.join(',') + (QS.has('serial') ? ':serial' : '');
  let kept = []; try { kept = QS.has('resume') ? JSON.parse(localStorage.getItem(KEEP) || '[]') : []; } catch {}
  for (const d of demos) {
    const tr = document.createElement('tr'); tr.innerHTML = `<td>${d.dir}</td>`; t.appendChild(tr);
    for (const [w, h] of SIZES) {
      document.getElementById('st').textContent = `${d.dir} ${w}×${h}…`;
      const old = kept.find((k) => k.demo === d.dir && k.size === `${w}x${h}`);
      if (old) { RESULTS.push(old); const td = document.createElement('td'); td.textContent = '(kept)'; tr.appendChild(td); continue; }
      const touch = w <= 1100, url = `../../demos/${d.cat}/${d.dir}/`;
      try { localStorage.setItem('moheat.guide', 'done'); } catch {}   // (again: another checker tab may share this origin)
      const f = await load(url, w, h); mute(f.contentWindow);
      if (touch && !QS.has('serial')) { f.contentDocument.documentElement.classList.add('no-serial'); f.contentWindow.dispatchEvent(new Event('resize')); }
      await wait(1400);
      const r = { demo: d.dir, size: `${w}x${h}`, cover: measure(f, touch) };
      const R = f.contentDocument.documentElement; r.layout = R.classList.contains('lay-drawer') ? 'drawer' : R.classList.contains('lay-below') ? 'below' : 'beside';
      if (r.layout === 'drawer') {   // open the 🎛 drawer: every control in it on screen and tappable
        const b = f.contentDocument.querySelector('.mside-btn'); if (b) { b.click(); await wait(700); r.drawer = measure(f, touch, 'aside.side'); b.click(); await wait(350); } else r.drawer = { scrollY: 0, scrollX: 0, off: ['no 🎛 button'], small: [] };
      }
      if (touch && QS.get('guide') !== '0') r.guide = await guide(f, touch);
      if (QS.get('play') !== '0' && await play(f)) { r.play = measure(f, touch); await wait(400); r.answers = await answers(f, touch); }
      if (touch && Math.min(w, h) <= 600 && QS.get('fs') !== '0') r.fs = await fullscreen(f);   // phones: ⛶ + rotate card
      f.remove();
      RESULTS.push(r); try { localStorage.setItem(KEEP, JSON.stringify(RESULTS)); } catch {}
      const scroll = (m) => m && (m.scrollY > 0 || m.scrollX > 0), fail = scroll(r.cover) || scroll(r.play) || r.cover.off.length || (r.play?.off.length) || (r.drawer?.off.length) || (r.drawer?.small.length) || (r.guide?.issues?.length) || (r.answers?.off.length) || (r.fs?.issues?.length) || (touch && (r.cover.small.length || r.play?.small.length || r.answers?.small.length));
      if (fail) bad++;
      const td = document.createElement('td'); td.className = fail ? 'bad' : 'ok';
      const fm = (m) => `${m.scrollY > 0 ? 'Y+' + m.scrollY + ' ' : ''}${m.scrollX > 0 ? 'X+' + m.scrollX + ' ' : ''}${m.stage || ''}`;
      td.innerHTML = `<small>${r.layout}</small> ${fm(r.cover)}${r.play ? ' / ' + fm(r.play) : ''}`
        + (r.cover.off.length ? `<br><small>off: ${r.cover.off.join(', ')}</small>` : '') + (r.play?.off.length ? `<br><small>off(play): ${r.play.off.join(', ')}</small>` : '')
        + (r.cover.small.length ? `<br><small>&lt;44: ${r.cover.small.join(', ')}</small>` : '') + (r.play?.small.length ? `<br><small>&lt;44 (play): ${r.play.small.join(', ')}</small>` : '')
        + (r.drawer?.off.length || r.drawer?.small.length ? `<br><small>drawer: ${[...r.drawer.off, ...r.drawer.small].join(', ')}</small>` : '')
        + (r.answers?.off.length ? `<br><small>answers off: ${r.answers.off.join(', ')}</small>` : '') + (r.answers?.small.length ? `<br><small>answers &lt;44: ${r.answers.small.join(', ')}</small>` : '')
        + (r.guide?.issues?.length ? `<br><small>guide: ${r.guide.issues.join('; ')}</small>` : '')
        + (r.fs?.issues?.length ? `<br><small>fullscreen: ${r.fs.issues.join('; ')}</small>` : '');
      tr.appendChild(td);
    }
  }
  document.getElementById('st').textContent = `done: ${demos.length} demos × ${SIZES.length} sizes, ${bad} with problems`;
  window.DONE = true;
})();
</script></body></html>
