<!doctype html>
<!-- The ONE cover template (DEMO_DESIGN_GUIDE §7.3 "UI v2 cover", user 2026-11-08: "one standard format, never drawn per demo").
     tools/web/covers.py opens it in headless Chrome and screenshots the finished cover image:
       cover_tpl.html?demo=demos/<cat>/<dir>&lang=en|ja|zh&layout=wide|compact
     Inputs: <demo>/cover.json (texts per language, tone, chips) + <demo>/media/cover/art.webp (the picture: background + character
     composed once to the 2b numbers). Wide = 1280×720 CSS px (rendered ×1.5 → 1920×1080), compact = 400×225 (×3 → 1200×675).
     The live controls (demos/shared/ui2.css .u2-row-*) sit BELOW the copy block: the copy must end by 31cqw (wide) / 50 % of the
     height (compact) — window.TPL.fit reports it, covers.py FAILs a cover that does not fit. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&family=Shippori+Mincho+B1:wght@600;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0a12; overflow: hidden; }
  body { container-type: inline-size; position: relative; color: #fff; -webkit-font-smoothing: antialiased;
    --tone: 8 10 20; --title: "Zen Maru Gothic", "Noto Sans JP", sans-serif; --ui: "Inter", "Noto Sans JP", "PingFang SC", sans-serif; --accent: #ffd479; }
  body[data-cat="healing"] { --accent: #a8e6c1; } body[data-cat="for-men"] { --accent: #8fd3ff; } body[data-cat="for-women"] { --accent: #ffa8c8; }
  body[data-cat="nobunaga-suntory"] { --accent: #e8c36a; --title: "Shippori Mincho B1", "Noto Sans JP", serif; }
  body[data-lang="zh"] { --title: "PingFang SC", "Hiragino Sans GB", sans-serif; --ui: "Inter", "PingFang SC", sans-serif; }
  body[data-lang="zh"][data-cat="nobunaga-suntory"] { --title: "Songti SC", "STSong", serif; }
  .art { position: absolute; inset: 0; background: center / cover no-repeat; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(var(--tone) / .86) 0%, rgb(var(--tone) / .74) 30%, rgb(var(--tone) / .34) 50%, rgb(var(--tone) / 0) 62%); }
  .shade2 { position: absolute; inset: auto 0 0 0; height: 30%; background: linear-gradient(rgb(6 5 10 / 0), rgb(6 5 10 / .55)); }   /* under the live controls + bar */
  .copy { position: absolute; left: 4cqw; top: 6cqw; width: 48cqw; display: flex; flex-direction: column; align-items: flex-start; font-family: var(--ui); }
  .kick { font: 600 .86cqw/1.3 var(--ui); letter-spacing: .18em; text-transform: uppercase; color: rgb(255 255 255 / .78); margin: 0 0 1.3cqw; }
  .kick.series { font-family: "Shippori Mincho B1", serif; font-weight: 800; letter-spacing: .1em; text-transform: none; color: #f6d27a; padding: .3cqw 1cqw;
    border: 1px solid rgb(246 210 122 / .6); border-radius: 99px; background: rgb(40 20 8 / .45); }
  h1 { margin: 0; font: 900 5.6cqw/1.12 var(--title); letter-spacing: .01em; text-wrap: balance; text-shadow: 0 .2cqw 1.4cqw rgb(0 0 0 / .55); }
  body[data-cat="nobunaga-suntory"] h1 { font-weight: 800; }
  h1 span { display: block; text-wrap: balance; }   /* a line that does not fit wraps (balanced; Japanese at phrase boundaries) */
  body[data-lang="ja"] h1 span { word-break: auto-phrase; } body[data-lang="zh"] h1 span { word-break: keep-all; line-break: strict; }
  .tag { margin: 1.1cqw 0 0; font: 600 1.5cqw/1.35 var(--ui); color: rgb(255 255 255 / .92); max-width: 46cqw; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    text-shadow: 0 1px 6px rgb(0 0 0 / .6); }
  .chips { display: flex; flex-wrap: wrap; gap: .6cqw; margin-top: 1.5cqw; max-width: 48cqw; }
  .chip { font: 600 1.1cqw/1 var(--ui); padding: .6cqw 1.1cqw; border-radius: 99px; background: rgb(10 8 16 / .55); border: 1px solid rgb(255 255 255 / .3); white-space: nowrap; display: inline-flex; gap: .5em; align-items: center; }
  .chip.warm { border-color: rgb(255 138 61 / .85); } .chip.cool { border-color: rgb(159 216 255 / .85); }
  .chip em { font-style: normal; font-weight: 700; font-size: .86em; letter-spacing: .02em; }
  .chip.warm em { color: #ffb27a; } .chip.cool em { color: #bfe6ff; }
  /* compact (phones): title + tagline only, bigger, on a stronger shade */
  body.compact .shade { background: linear-gradient(90deg, rgb(var(--tone) / .9) 0%, rgb(var(--tone) / .72) 36%, rgb(var(--tone) / .2) 62%, rgb(var(--tone) / 0) 74%),
    linear-gradient(rgb(var(--tone) / .5), rgb(var(--tone) / 0) 60%); }
  body.compact .copy { left: 3cqw; top: 3.4cqw; width: 64cqw; }
  body.compact .kick { display: none; }
  body.compact .kick.series { display: block; font-size: 2.2cqw; margin-bottom: 1.4cqw; padding: .4cqw 1.6cqw; }
  body.compact h1 { font-size: 7.6cqw; }
  body.compact .tag { font-size: 3.3cqw; margin-top: 1.4cqw; max-width: 62cqw; -webkit-line-clamp: 1; }
  body.compact .chips { display: none; }
</style></head>
<body>
<div class="art"></div><div class="shade"></div><div class="shade2"></div>
<div class="copy"><p class="kick"></p><h1></h1><p class="tag"></p><div class="chips"></div></div>
<script>
(async () => {
  const Q = new URLSearchParams(location.search), demo = Q.get('demo'), L = Q.get('lang') || 'en', compact = Q.get('layout') === 'compact';
  const KICK = { en: 'MoHeat Evo · Binaural ASMR × Thermal Haptics', ja: 'MoHeat Evo · バイノーラル ASMR × 温冷ハプティクス', zh: 'MoHeat Evo · 双耳 ASMR × 温冷触感' };
  const KIND = { warm: { en: 'warm', ja: 'あたたか', zh: '温暖' }, cool: { en: 'cool', ja: 'ひんやり', zh: '清凉' } };
  const pick = (o) => (o == null ? '' : typeof o === 'string' ? o : o[L] ?? o.en ?? '');
  const D = await (await fetch(`/${demo}/cover.json`, { cache: 'no-store' })).json();
  const cat = demo.split('/')[1];
  document.body.dataset.cat = cat; document.body.dataset.lang = L; document.documentElement.lang = L === 'zh' ? 'zh-CN' : L; document.body.classList.toggle('compact', compact);
  if (D.tone) document.body.style.setProperty('--tone', D.tone);
  const art = new Image(); art.src = `/${demo}/media/cover/art.webp?${Date.now()}`; await art.decode();
  document.querySelector('.art').style.backgroundImage = `url("${art.src}")`;
  const k = document.querySelector('.kick');
  if (D.series) { k.textContent = pick(D.series); k.classList.add('series'); } else k.textContent = KICK[L] || KICK.en;
  const h1 = document.querySelector('h1'), title = pick(D.title);
  h1.innerHTML = title.split('\n').map((s) => `<span>${s.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</span>`).join('');
  const tag = pick(D.tagline); document.querySelector('.tag').textContent = tag; document.querySelector('.tag').hidden = !tag;
  document.querySelector('.chips').innerHTML = (D.chips || []).map((c) => `<span class="chip ${c.kind || ''}">${pick(c.text)}${KIND[c.kind] ? `<em>${pick(KIND[c.kind])}</em>` : ''}</span>`).join('');
  await document.fonts.ready;
  // the title fits the column: shrink (never below 3.2cqw wide / 5cqw compact) until every line fits and the block ends in time
  const W = document.body.clientWidth, cq = W / 100, copy = document.querySelector('.copy');
  const maxW = (compact ? 64 : 48) * cq, endMax = compact ? 0.5 * innerHeight : 31 * cq;
  let f = compact ? 7.6 : 5.6; const fmin = compact ? 5 : 3.2;
  const lines = () => [h1.scrollWidth, ...[...h1.children].map((s) => s.scrollWidth)];
  // too tall: the title keeps its size as long as possible — first the tagline goes to one line, then the chips get smaller, then the title shrinks
  const tall = () => copy.getBoundingClientRect().bottom > endMax;
  if (tall()) document.querySelector('.tag').style.webkitLineClamp = '1';
  if (tall()) document.querySelectorAll('.chip').forEach((c) => { c.style.fontSize = '.92cqw'; });
  while (f > fmin && (Math.max(...lines()) > maxW || tall())) { f -= .1; h1.style.fontSize = `${f}cqw`; }
  const end = copy.getBoundingClientRect().bottom;
  const nl = Math.round(h1.getBoundingClientRect().height / (parseFloat(getComputedStyle(h1).fontSize) * 1.12));
  window.TPL = { done: true, lines: nl, fit: end <= endMax + .5 && Math.max(...lines()) <= maxW + 1 && nl <= 3, end: +(end / cq).toFixed(2), endMax: +(endMax / cq).toFixed(2), h1: +f.toFixed(1) };
})().catch((e) => { window.TPL = { done: true, err: String(e) }; });
</script>
</body></html>
